version: "3.9"

services:
  agent:
    build: .
    container_name: ai-agent
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./agent_notes:/app/agent_notes
      - ./agent_workspace:/app/agent_workspace
      - agent_data:/app/data
    restart: unless-stopped

volumes:
  agent_data: